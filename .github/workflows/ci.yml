# Builds and tests every push and pull request on Windows, Linux and macOS. A tag vX.Y.Z also publishes one file per OS
# to a GitHub release: Butler-X.Y.Z.<commits>.exe (Windows), Butler-X.Y.Z.<commits>-linux-x64, Butler-X.Y.Z.<commits>-osx-arm64.
# Each needs the .NET 9 runtime (on Windows the Desktop Runtime).
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, framework: net9.0-windows10.0.17763.0, rid: win-x64, suffix: .exe }
          - { os: ubuntu-latest, framework: net9.0, rid: linux-x64, suffix: -linux-x64 }
          - { os: macos-latest, framework: net9.0, rid: osx-arm64, suffix: -osx-arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # the release, on a tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: the version counts the commits

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # X.Y.Z.<commit count> (counted again by the csproj): 1.0.0 for a tag v1.0.0, 0.0.0 for any other build.
      - name: Version
        shell: pwsh
        run: |
          $base = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "VERSION=$base.$(git rev-list --count HEAD)" >> $env:GITHUB_ENV
          "VERSION_ARG=-p:VersionBase=$base" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build -c Release ${{ env.VERSION_ARG }}

      # Outlook and Azure DevOps tests skip themselves here (no Outlook running, no BUTLER_TEST_ADO_ORG), and so does
      # the secret service test on Linux (no keyring running).
      - name: Test
        run: dotnet test -c Release --no-build

      # One Butler file with every library inside (native ones extracted at start), without .NET.
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Butler -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --self-contained false -o publish ${{ env.VERSION_ARG }} `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          Get-ChildItem publish
          Copy-Item (Get-ChildItem publish -Filter 'Butler*' | Where-Object Extension -in '', '.exe').FullName "Butler-$env:VERSION${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Butler-${{ env.VERSION }}${{ matrix.suffix }}
          path: Butler-${{ env.VERSION }}${{ matrix.suffix }}

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Butler-${{ env.VERSION }}${{ matrix.suffix }}
          generate_release_notes: true
