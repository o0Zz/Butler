<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3f"/>
      <stop offset="1" stop-color="#11131b"/>
    </linearGradient>
    <linearGradient id="satin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4054"/>
      <stop offset="1" stop-color="#1c2030"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3b4f"/>
      <stop offset="1" stop-color="#b81d30"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#jacket)"/>
  <g clip-path="url(#tile)">
    <!-- shirt: a white V from the collar down -->
    <path d="M156 16 H356 L256 424 Z" fill="#f6f7fb"/>
    <!-- satin lapels along the V -->
    <path d="M156 16 L256 424 L256 444 L104 16 Z" fill="url(#satin)"/>
    <path d="M356 16 L256 424 L256 444 L408 16 Z" fill="url(#satin)"/>
    <!-- jacket button -->
    <circle cx="256" cy="472" r="11" fill="#3a4054"/>
    <!-- wing collar -->
    <path d="M206 128 L176 176 L236 166 Z" fill="#ffffff" stroke="#d5d9e4" stroke-width="4" stroke-linejoin="round"/>
    <path d="M306 128 L336 176 L276 166 Z" fill="#ffffff" stroke="#d5d9e4" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- faint rim, so the tile stays visible on a dark taskbar -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="8"/>
  <!-- bow tie -->
  <path d="M256 150 L170 108 C156 102 146 110 146 124 V196 C146 210 156 218 170 212 L256 170 Z" fill="url(#red)"/>
  <path d="M256 150 L342 108 C356 102 366 110 366 124 V196 C366 210 356 218 342 212 L256 170 Z" fill="url(#red)"/>
  <rect x="228" y="134" width="56" height="52" rx="14" fill="#c92236"/>
  <rect x="236" y="142" width="40" height="36" rx="10" fill="url(#red)"/>
  <!-- studs -->
  <circle cx="256" cy="262" r="11" fill="#1c2030"/>
  <circle cx="256" cy="326" r="10" fill="#1c2030"/>
</svg>
