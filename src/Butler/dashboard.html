<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --side: #eef0f3; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --hover: #f1f3f6; --sel: #e8effd; --accent: #2f6fe4; --accent-text: #fff;
    --ok: #1f9d55; --ok-bg: #e5f6ec; --warn: #b7791f; --warn-bg: #fdf3dc; --err: #d64545; --err-bg: #fde8e8;
    --run: #2f6fe4; --run-bg: #e8effd; --idle: #6b7280; --idle-bg: #eef0f3;
    --k-schedule: #2f6fe4; --k-mail: #7c4ddb; --k-ado: #0f8a7e; --k-file: #c46a12;
    --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 14px rgb(0 0 0 / .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --panel: #1e2128; --side: #1a1c22; --text: #e6e8ec; --muted: #9097a3; --line: #2c3039;
      --hover: #252932; --sel: #23324f; --accent: #5b8def;
      --ok: #4cc38a; --ok-bg: #1d3328; --warn: #e3b341; --warn-bg: #3a3020; --err: #f07171; --err-bg: #3b2224;
      --run: #7aa5f5; --run-bg: #23324f; --idle: #9097a3; --idle-bg: #2a2e37;
      --k-schedule: #7aa5f5; --k-mail: #a98bf0; --k-ado: #4cc3b5; --k-file: #e8a25a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: flex; overflow: hidden; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 5px 12px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--err); }
  button.icon { padding: 5px 7px; }
  button:disabled { opacity: .5; cursor: default; filter: none; }
  .ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  /* Sidebar */
  nav { width: 220px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 10px; gap: 2px; flex-shrink: 0; }
  nav h1 { font-size: 18px; margin: 0 6px 18px; display: flex; align-items: center; gap: 10px; line-height: 1.1; }
  nav h1 .logo svg { width: 34px; height: 34px; display: block; }
  nav h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer; user-select: none; }
  nav a .label { flex: 1; }
  nav a:hover { background: var(--hover); }
  nav a.active { background: var(--panel); font-weight: 600; box-shadow: var(--shadow); }
  nav a.active .ic { color: var(--accent); }
  nav .count { font-size: 12px; color: var(--muted); }
  nav .count.badge { background: var(--err); color: #fff; border-radius: 10px; padding: 0 7px; font-weight: 600; }
  nav .bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
  nav .bottom .row2 { display: flex; gap: 6px; }
  nav .bottom .row2 button { flex: 1; justify-content: center; }
  .sources h4 { margin: 0 6px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .source { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 12.5px; }
  .source .what { flex: 1; min-width: 0; }
  .source .state { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .source .state.err { color: var(--err); }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .led.err { background: var(--err); } .led.wait { background: var(--idle); }
  /* Main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 18px 24px 12px; display: flex; align-items: center; gap: 10px; }
  header h2 { margin: 0; font-size: 20px; flex: 1; }
  #hdr { display: flex; gap: 8px; align-items: center; }
  .banner { margin: 0 24px 12px; padding: 10px 14px; border-radius: 8px; background: var(--err-bg); color: var(--err); display: flex; gap: 8px; align-items: center; }
  .content { flex: 1; min-height: 0; padding: 0 24px 24px; overflow: auto; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 10px; white-space: nowrap; }
  .Done { color: var(--ok); background: var(--ok-bg); } .Failed { color: var(--err); background: var(--err-bg); }
  .Waiting { color: var(--warn); background: var(--warn-bg); } .Running { color: var(--run); background: var(--run-bg); }
  .Answered, .Stopped, .none { color: var(--idle); background: var(--idle-bg); }
  /* Stats (runs header) */
  .stat { display: flex; flex-direction: column; align-items: flex-end; padding: 2px 12px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat b { font-size: 16px; line-height: 1.1; }
  .stat span { font-size: 11px; color: var(--muted); }
  .stat.hot b { color: var(--warn); } .stat.bad b { color: var(--err); }
  /* Runs: list + detail */
  .split { display: flex; gap: 16px; height: 100%; }
  .list { width: 42%; min-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; box-shadow: var(--shadow); }
  .row { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--hover); } .row.sel { background: var(--sel); }
  .row .top { display: flex; align-items: center; gap: 8px; }
  .row .top b { flex: 1; }
  .row .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row .sum { margin-top: 2px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .detail .head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .detail .head h3 { margin: 0 0 4px; font-size: 17px; display: flex; gap: 10px; align-items: center; }
  .detail .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .ask { margin: 14px 18px 0; padding: 12px 14px; border-radius: 8px; background: var(--warn-bg); }
  .ask .q { font-weight: 600; margin-bottom: 10px; }
  .ask .bar { display: flex; gap: 8px; }
  input, select, textarea { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .ask input { flex: 1; }
  .result { flex: 1; overflow: auto; padding: 4px 18px 14px; word-wrap: break-word; }
  .result h1, .result h2, .result h3 { font-size: 15px; margin: 16px 0 6px; }
  .result p, .result ul, .result ol { margin: 8px 0; }
  .result table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .result th, .result td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  .result th { background: var(--bg); }
  .result code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .result pre { background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow: auto; }
  .result pre code { padding: 0; }
  .result a { color: var(--accent); }
  .activity { display: flex; flex-direction: column; gap: 4px; padding: 6px 0; }
  .activity .say { margin-top: 6px; }
  .activity .step { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  .acts summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  /* Cards: triggers, skills */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
  .card .title { display: flex; align-items: center; gap: 10px; }
  .card .title b { font-size: 15px; flex: 1; }
  .badge-kind { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; background: color-mix(in srgb, currentColor 13%, transparent); }
  .k-schedule { color: var(--k-schedule); } .k-mail { color: var(--k-mail); } .k-ado { color: var(--k-ado); } .k-file { color: var(--k-file); }
  .kv { display: grid; grid-template-columns: 74px 1fr; gap: 4px 10px; font-size: 13px; }
  .kv > span:nth-child(odd) { color: var(--muted); }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; margin: 0 4px 2px 0; border-radius: 10px; background: var(--idle-bg); }
  .chip.bad { background: var(--err-bg); color: var(--err); }
  .prompt { background: var(--bg); border-radius: 6px; padding: 6px 9px; max-height: 64px; overflow: auto; white-space: pre-wrap; }
  .desc { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; border-top: 1px solid var(--line); }
  .card .foot .info { flex: 1; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--idle-bg); }
  .dots i.Done { background: var(--ok); } .dots i.Failed { background: var(--err); } .dots i.Waiting { background: var(--warn); }
  .dots i.Running { background: var(--run); } .dots i.Answered, .dots i.Stopped { background: var(--idle); }
  /* Forms: settings, trigger editor */
  .settings { max-width: 780px; display: flex; flex-direction: column; gap: 14px; }
  .settings .card { gap: 14px; }
  .settings h3 { margin: 0; font-size: 15px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-weight: 600; }
  .field .hint { color: var(--muted); font-size: 12.5px; }
  .field .bar { display: flex; gap: 8px; align-items: center; }
  .field .bar input, .field .bar select { flex: 1; min-width: 0; }
  .field input.mono, .field textarea.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  .field textarea { resize: vertical; }
  .field .ok, .field .err { font-size: 12.5px; }
  .field .days { display: flex; gap: 12px; flex-wrap: wrap; }
  .field .days label { font-weight: normal; display: flex; gap: 4px; align-items: center; }
  .note { padding: 8px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
  .savebar { display: flex; gap: 8px; align-items: center; }
  .savebar .file { margin-left: auto; font-size: 11px; }
  /* Trigger editor */
  .overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: flex; justify-content: flex-end; z-index: 10; }
  .drawer { width: min(620px, 100%); height: 100%; background: var(--panel); display: flex; flex-direction: column; box-shadow: -8px 0 30px rgb(0 0 0 / .2); }
  .drawer .dh { padding: 18px 22px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .drawer .dh h3 { margin: 0; flex: 1; font-size: 17px; }
  .drawer .db { flex: 1; overflow: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 16px; }
  .drawer .df { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .drawer .df .grow { flex: 1; }
  .kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kinds button { flex-direction: column; gap: 4px; padding: 10px 6px; justify-content: center; }
  .kinds button.on { border-color: currentColor; background: color-mix(in srgb, currentColor 10%, var(--panel)); font-weight: 600; }
  .kinds button .ic { width: 20px; height: 20px; }
  .vars { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
  .vars .chip { cursor: pointer; font-family: "Cascadia Mono", Consolas, monospace; }
  .vars .chip:hover { background: var(--sel); }
  .error-box { padding: 8px 12px; border-radius: 6px; background: var(--err-bg); color: var(--err); font-size: 13px; }
  /* To do */
  .todo { display: flex; flex-direction: column; gap: 14px; }
  .addbar { display: flex; gap: 8px; }
  .addbar input { flex: 1; padding: 8px 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { border-radius: 14px; padding: 3px 12px; font-size: 13px; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chips .n { opacity: .7; font-size: 12px; }
  .proj { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px 0 2px; }
  .proj h3 { margin: 6px 16px 6px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
  .proj h3 .n, .proj h4 .n { font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .proj h4 { margin: 12px 16px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .proj .addhere { display: flex; gap: 6px; align-items: center; padding: 6px 16px 10px; color: var(--muted); font-size: 13px; cursor: pointer; }
  .proj .addhere:hover { color: var(--accent); }
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 7px 16px; border-top: 1px solid var(--line); }
  .task:hover { background: var(--hover); }
  .task.gone { opacity: .35; }
.task .grip { visibility: hidden; cursor: grab; color: var(--muted); margin: 1px -6px 0 -14px; display: flex; border-radius: 4px; }
.task .grip .ic { width: 14px; height: 18px; }
.task:hover .grip { visibility: visible; }
.task .grip:hover { color: var(--text); background: var(--line); }
.task.dragging { opacity: .4; }
.task.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.task.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.todo.drag .slot { pointer-events: none; }
.drop-on { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 6px; }
.task.inserting { background: var(--hover); }
.task input.inline { flex: 1; width: 100%; border: 0; border-bottom: 1px solid var(--accent); border-radius: 0; background: transparent; padding: 0; font: inherit; outline: none; }
.task .text { cursor: text; }
.task .pen { visibility: hidden; padding: 1px 4px; border: 0; background: transparent; color: var(--muted); }
.task:hover .pen { visibility: visible; }
.task .pen:hover { color: var(--text); background: var(--line); }
.slot { position: relative; height: 10px; margin: -5px 0; cursor: pointer; z-index: 1; }
.slot:hover::before { content: ''; position: absolute; left: 22px; right: 16px; top: 4px; border-top: 2px solid var(--accent); }
.slot:hover::after { content: '+'; position: absolute; left: 6px; top: -3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); color: var(--accent-text); font-size: 14px; line-height: 15px; text-align: center; }
.proj h3 .hide { margin-left: auto; padding: 1px 4px; border: 0; background: transparent; color: var(--muted); }
.proj h3 .hide:hover { color: var(--text); background: var(--line); }
.chips button.hidden { opacity: .6; border-style: dashed; }
  .task .what { flex: 1; min-width: 0; }
  .task .tm { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 1px; align-items: center; min-width: 0; }
  .task .tm span { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task .tm .ic { width: 13px; height: 13px; }
  .check { width: 18px; height: 18px; border-radius: 50%; padding: 0; border: 2px solid var(--muted); background: transparent; margin-top: 2px; flex-shrink: 0; color: var(--muted); }
  .check:hover { background: color-mix(in srgb, currentColor 18%, transparent); }
  .p4 { --p: #d1453b; } .p3 { --p: #eb8909; } .p2 { --p: #246fe0; } .p1 { --p: var(--muted); }
  .check.p4, .check.p3, .check.p2 { border-color: var(--p); color: var(--p); background: color-mix(in srgb, var(--p) 10%, transparent); }
  .tm .due.today { color: var(--ok); } .tm .due.over { color: var(--err); }
  .prio { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .prio button { justify-content: center; color: var(--p); }
  .prio button.on { border-color: var(--p); font-weight: 600; background: color-mix(in srgb, var(--p) 12%, var(--panel)); }
  .datechips { display: flex; gap: 6px; flex-wrap: wrap; }
  .datechips button { padding: 2px 10px; font-size: 12.5px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 10px 8px 16px;
    border-radius: 8px; display: flex; gap: 14px; align-items: center; z-index: 20; box-shadow: 0 6px 24px rgb(0 0 0 / .25); max-width: 70%; }
  .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent); }
  .toast.err { background: var(--err); color: #fff; }
</style>
</head>
<body>
<nav>
  <h1><span class="logo"><!--logo--></span><span>Butler<small data-tr-title title="Butler's version (and its commit)"><!--version--></small><small id="new-version"></small></span></h1>
  <a data-view="runs"><i data-ic="runs"></i><span class="label" data-tr>Runs</span><span class="count" id="c-runs"></span></a>
  <a data-view="todo"><i data-ic="todo"></i><span class="label" data-tr>To do</span><span class="count" id="c-todo"></span></a>
  <a data-view="triggers"><i data-ic="triggers"></i><span class="label" data-tr>Triggers</span><span class="count" id="c-triggers"></span></a>
  <a data-view="skills"><i data-ic="skills"></i><span class="label" data-tr>Skills</span><span class="count" id="c-skills"></span></a>
  <div class="bottom">
    <div class="sources" id="sources"></div>
    <div class="row2">
      <button onclick="send('revealTriggers')" data-tr-title title="Open the folder of the triggers file"><i data-ic="folder"></i><span data-tr>Folder</span></button>
    </div>
    <a data-view="settings"><i data-ic="settings"></i><span class="label" data-tr>Settings</span></a>
  </div>
</nav>
<main>
  <header><h2 id="title"></h2><span id="hdr"></span></header>
  <div id="banner"></div>
  <div class="content" id="content"></div>
</main>
<div id="modal"></div>
<div id="toast"></div>

<!--marked-->
<script>
// Claude's output can quote mail content: raw HTML is shown as text and only http(s) links are kept.
const md = new marked.Marked({ gfm: true, breaks: true, renderer: {
  html: h => esc(h),
  link: (href, title, text) => /^https?:\/\//i.test(href) ? `<a href="${esc(href)}" title="${esc(title || '')}">${text}</a>` : text,
  image: (href, title, text) => esc(text),
} });
const markdown = s => md.parse(s.replace(/^`?BUTLER-(ASK|SUMMARY):.*$/gm, '').trim());
let state = { triggers: [], runs: [], skills: [], kinds: [], sources: [] }, view = 'runs', selected = null, draft = '';
let watched = null, drawnRun = null, resultScroll = 0, actsOpen = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const send = (cmd, args = {}) => invokeCSharpAction(JSON.stringify({ cmd, ...args })); // the web view's bridge to C#
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
// The texts in the language of the settings: LANG maps the English text to its translation (Lang/<code>.json), "{0}" is filled.
const tr = (text, ...args) => (LANG[text] ?? text).replace(/\{(\d)\}/g, (_, i) => args[i]);
const js = v => esc(JSON.stringify(v)); // a JS value inside an HTML attribute (onclick="...")

// Icons: 24x24 strokes, drawn with currentColor.
const IC = {
  runs: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  triggers: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  skills: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
  settings: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  schedule: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

const icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24">${IC[name] || ''}</svg>`;

function ago(d) {
  if (!d) return '';
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 0) return tr('in {0}', span(-s));
  return s < 60 ? tr('just now') : tr('{0} ago', span(s));
}
function span(s) {
  return s < 3600 ? tr('{0} min', Math.round(s / 60)) : s < 86400 ? tr('{0} h', Math.round(s / 3600)) : tr('{0} d', Math.round(s / 86400));
}
const full = d => d ? new Date(d).toLocaleString(LOCALE, { dateStyle: 'medium', timeStyle: 'short' }) : '';
function duration(r) {
  if (!r.ended) return '';
  const s = Math.round((new Date(r.ended) - new Date(r.started)) / 1000);
  return s < 60 ? tr('{0} s', s) : tr('{0} min {1} s', Math.floor(s / 60), s % 60);
}
const money = n => '$' + (n || 0).toFixed(2);
const kindOf = name => state.triggers.find(t => t.name.toLowerCase() === String(name).toLowerCase())?.on;
const kindBadge = (on, size = '') => `<span class="badge-kind k-${esc(on)}" style="${size}">${icon(on)}</span>`;

// Redraws everything but keeps the scroll positions (the list must not jump when a row is clicked).
function render() {
  const panes = () => document.querySelectorAll('.content, .list');
  const scroll = [...panes()].map(el => el.scrollTop);
  draw();
  panes().forEach((el, i) => el.scrollTop = scroll[i] ?? 0);
}

function draw() {
  const st = state.stats || {};
  $('c-runs').textContent = st.waiting || state.runs.length;
  $('c-runs').className = 'count' + (st.waiting ? ' badge' : '');

  $('c-skills').textContent = state.skills.length;
  const dueNow = (state.todo?.list?.tasks || []).filter(x => x.due && x.due.slice(0, 10) <= day(0) && !state.todo.hidden.includes(x.projectId)).length;
  $('c-todo').textContent = dueNow || '';
  $('c-todo').title = dueNow ? tr('{0} due today or late', dueNow) : '';
  $('banner').innerHTML = state.error ? `<div class="banner">${icon('alert')}${esc(state.error)}</div>` : '';
  drawSources();
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  $('title').textContent = { runs: tr('Runs'), todo: tr('To do'), triggers: tr('Triggers'), skills: tr('Skills'), settings: tr('Settings') }[view];
  $('hdr').innerHTML = view === 'runs' ? stats() + (state.runs.length ? `<button class="danger" onclick="if(confirm(${js(tr('Delete every run? Runs still running or waiting for an answer are kept. Their history and costs are lost.'))}))send('clearRuns')">${icon('trash')}${tr('Clear')}</button>` : '')
    : view === 'todo' ? (state.todo ? `<span class="muted" style="font-size:12.5px">${esc(state.todo.label || '')}${state.todo.read ? ' · ' + esc(tr('updated {0}', ago(state.todo.read))) : ''}</span>
        <button onclick="send('todoRefresh')" title="${tr('Read the list again (F5)')}">${icon('sync')}${tr('Refresh')}</button>
        <button onclick="send('todoOpen')" title="${state.todo.backend === 'todoist' ? tr('Open Todoist in the browser') : tr('Show the todo.txt file in its folder')}">${icon('open')}${state.todo.backend === 'todoist' ? 'Todoist' : tr('Folder')}</button>` : '')
    : view === 'skills' ? `<button onclick="send('openSkills')">${icon('folder')}${tr('Open folder')}</button>`
    : view === 'triggers' ? `<button onclick="send('chat')" title="${esc(tr('Opens {0} in a terminal, in your skills folder: describe what you want, it edits the triggers and skills', cap(state.cli)))}">${icon('sparkles')}${tr('Ask AI')}</button>
        <button class="primary" onclick="openEditor()">${icon('plus')}${tr('New trigger')}</button>` : '';
  ({ runs: renderRuns, todo: renderTodo, triggers: renderTriggers, skills: renderSkills, settings: renderSettings })[view]();
}

function stats() {
  const st = state.stats || {};
  const tile = (value, label, cls = '') => `<div class="stat ${cls}"><b>${value}</b><span>${label}</span></div>`;
  return `<div style="display:flex">${tile(st.waiting || 0, tr('waiting'), st.waiting ? 'hot' : '')}${tile(st.running || 0, tr('running'))}
    ${tile(st.today || 0, tr('runs today'))}${tile(st.failedWeek || 0, tr('failed, 7 days'), st.failedWeek ? 'bad' : '')}${tile(money(st.costMonth), tr('this month'))}</div>`;
}

function renderRuns() {
  const runs = state.runs;
  if (!runs.length) { $('content').innerHTML = `<div class="empty">${icon('runs')}${tr('No runs yet. Start one from the Triggers page.')}</div>`; return; }
  if (!runs.some(r => r.id === selected)) selected = runs[0].id;
  if (selected !== watched) { watched = selected; send('select', { id: selected }); } // C# then pushes its activity
  const r = runs.find(r => r.id === selected);
  const act = state.activity?.id === r.id ? state.activity.lines : null;
  resultScroll = document.querySelector('.result')?.scrollTop ?? 0;
  const input = $('answer');
  if (input) draft = input.value;
  const focused = document.activeElement?.id === 'answer';
  const meta = x => [esc(ago(x.started)), duration(x), x.costUsd != null ? money(x.costUsd) : ''].filter(Boolean).join(' · ');
  $('content').innerHTML = `<div class="split">
    <div class="list">${runs.map(x => `
      <div class="row ${x.id === selected ? 'sel' : ''}" onclick="selected='${x.id}';draft='';render()" title="${esc(full(x.started))}">
        <div class="top"><span class="k-${esc(kindOf(x.trigger) || 'none')}">${icon(kindOf(x.trigger) || 'runs')}</span><b>${esc(x.trigger)}</b><span class="pill ${x.status}">${tr(x.status)}</span></div>
        <div class="meta">${meta(x)}</div>
        <div class="sum">${esc(x.question || x.summary || (x.status === 'Running' ? tr('working…') : ''))}</div>
      </div>`).join('')}</div>
    <div class="detail">
      <div class="head">
        <h3>${kindOf(r.trigger) ? kindBadge(kindOf(r.trigger)) : ''}${esc(r.trigger)} <span class="pill ${r.status}">${tr(r.status)}</span></h3>
        <div class="muted">${esc(full(r.started))}${duration(r) ? ' · ' + duration(r) : ''}${r.costUsd != null ? ' · ' + money(r.costUsd) : ''}${r.cli ? ' · ' + esc(cap(r.cli)) : ''}</div>
        <div class="actions">
          <button onclick="send('openLog',{id:'${r.id}'})">${icon('log')}${tr('Open log')}</button>
          ${r.cli !== 'command' ? `<button onclick="send('terminal',{session:'${r.sessionId}',cli:'${r.cli || ''}'})">${icon('terminal')}${tr('Continue in terminal')}</button>` : ''}
          ${kindOf(r.trigger) ? `<button onclick="send('run',{name:'${esc(r.trigger)}'})">${icon('play')}${tr('Run again')}</button>` : ''}
          ${r.status === 'Running' ? `<button class="danger" onclick="if(confirm(${js(tr('Stop this run? The agent is killed where it is.'))}))send('stop',{id:'${r.id}'})">${icon('stop')}${tr('Stop')}</button>` : ''}
          ${r.status === 'Waiting' ? `<button onclick="send('stop',{id:'${r.id}'})" title="${tr('Drop the question, the run ends as Stopped')}">${icon('close')}${tr('Dismiss')}</button>` : ''}
        </div>
      </div>
      ${r.status === 'Waiting' ? `<div class="ask">
        <div class="q">${esc(r.question)}</div>
        <div class="bar">
          <button class="primary" onclick="answer('yes')">${tr('Yes')}</button>
          <button onclick="answer('no')">${tr('No')}</button>
          <input id="answer" placeholder="${tr('Or type an answer…')}" onkeydown="if(event.key==='Enter')answer(this.value)">
          <button onclick="answer($('answer').value)">${tr('Send')}</button>
        </div></div>` : ''}
      <div class="result">${r.status === 'Running'
        ? (act?.length ? activity(act) : `<span class="muted">${tr('Starting…')}</span>`)
        : (r.result ? markdown(r.result) : r.status === 'Stopped' ? `<p class="muted">${esc(r.summary)}</p>` : '') + (act?.length ? `<details class="acts" ${actsOpen ? 'open' : ''} ontoggle="actsOpen=this.open"><summary>${tr('Activity ({0} steps)', act.length)}</summary>${activity(act)}</details>` : '')}</div>
    </div></div>`;
  const again = $('answer');
  if (again) { again.value = draft; if (focused) again.focus(); }
  const result = document.querySelector('.result');
  if (r.status === 'Running') result.scrollTop = result.scrollHeight; // follow the live activity
  else if (r.id === drawnRun) result.scrollTop = resultScroll;
  drawnRun = r.id;
}

// The agent's sentences, and "▸ Tool: detail" for each tool call.
const activity = lines => `<div class="activity">${lines.map(l => `<div class="${l.startsWith('▸') ? 'step' : 'say'}">${esc(l)}</div>`).join('')}</div>`;

function answer(text) {
  text = (text || '').trim();
  if (!text) return;
  draft = '';
  send('answer', { id: selected, text });
}

        ${t.command ? `<span>${tr('Command')}</span><span class="muted">${tr('no agent')}</span>` : `<span>${tr('Skill')}</span><span>${t.skill ?`<span class="chip ${t.skillKnown ? '' : 'bad'}" title="${t.skillKnown ? '' : tr('No such skill in your skills folder')}">/${esc(t.skill)}</span>` : `<span class="muted">${tr('none')}</span>`}</span>`}
      </div>

          ${t.last ? esc(tr('Last run {0}', ago(t.last.started))) : tr('Never run')}${t.costMonth ? ' · ' + tr('{0} / 30 d', money(t.costMonth)) : ''}</span>

// To do: the list of the chosen backend (Todoist or a todo.txt file), all projects, edited by hand.
let todoShowHidden = false, todoSlots = [], todoInsertAt = null; // todoInsertAt: the slot whose input is open { projectId, sectionId, index }
let todoProject = 'all', todoIndex = [], todoKey = '', todoPending = new Set(), todoClearAfter, todoForm = null, todoLast = null, toastTimer;
const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv'); }; // yyyy-MM-dd, local

function renderTodo() {
  const t = state.todo;
  if (!t) {
    todoKey = '';
    $('content').innerHTML = `<div class="empty">${icon('todo')}${tr('No to-do list yet. Choose Todoist or a todo.txt file in the settings.')}
      <button class="primary" onclick="view='settings';draw()">${icon('settings')}${tr('Settings')}</button></div>`;
    return;
  }
  if (todoClearAfter !== undefined && t.read !== todoClearAfter) { todoPending.clear(); todoClearAfter = undefined; } // the reload after an edit
  const key = JSON.stringify([t, todoProject, [...todoPending], day(0), todoShowHidden, todoInsertAt, todoEditing]);
  if (key === todoKey && $('todo-add')) return; // pushed every 2 s: redraw only on change, not under the typing
  todoKey = key;
  const input = $('todo-add'), typed = input?.value || '', focused = document.activeElement === input;
  const inline = $('todo-insert'), inlineTyped = inline?.value || '';
  const editing = $('todo-edit'), editTyped = editing?.value, editFocused = document.activeElement === editing;
  const L = t.list;
  const error = t.error ? `<div class="error-box">${esc(t.error)}</div>` : '';
  if (!L) {
    $('content').innerHTML = `<div class="todo">${error || `<div class="empty">${icon('todo')}${esc(tr('Loading {0}…', t.label || ''))}</div>`}</div>`;
    return;
  }
  const hidden = new Set(t.hidden);
  const open = L.tasks;
  const count = p => open.filter(x => x.projectId === p).length;
  const shown = L.projects.filter(p => !hidden.has(p.id)), hiddenOnes = L.projects.filter(p => hidden.has(p.id));
  const projects = todoProject === 'all' ? shown : L.projects.filter(p => p.id === todoProject);
  if (todoProject !== 'all' && !projects.length) todoProject = 'all';
  todoIndex = [];
  todoSlots = [];
  const byOrder = (a, b) => a.order - b.order;
  const drop = (projectId, sectionId) => `ondragover="dropZone(event)" ondragleave="this.classList.remove('drop-on')" ondrop='dropFirst(event,${esc(JSON.stringify(projectId))},${esc(JSON.stringify(sectionId))})'`;
  const chip = p => `<button ${drop(p.id, null)} class="${todoProject === p.id ? 'on' : ''} ${hidden.has(p.id) ? 'hidden' : ''}" onclick="todoProject=${esc(JSON.stringify(p.id))};render()">${esc(p.name)} <span class="n">${count(p.id)}</span></button>`;
  // A task and its sub-tasks, indented; a "+" slot before each top-level task and after the last, to add one there.
  const tree = (tasks, parent, depth, place) => {
    const sib = tasks.filter(x => (x.parentId || null) === parent).sort(byOrder);
    return sib.map((x, k) => (depth ? '' : slot(place, k)) + row(x, depth) + tree(tasks, x.id, depth + 1, place)).join('')
      + (depth ? '' : slot(place, sib.length, !sib.length));
  };
  const block = (tasks, place) => { const ids = new Set(tasks.map(x => x.id)); return tree(tasks.map(x => ids.has(x.parentId) ? x : { ...x, parentId: null }), null, 0, place); };
  todoRedrawing = true;
  $('content').innerHTML = `<div class="todo">
    ${error}
    <div class="addbar"><input id="todo-add" placeholder="${esc(t.addHint)}" onkeydown="if(event.key==='Enter')todoAdd()">
      <button class="primary" onclick="todoAdd()">${icon('plus')}${tr('Add')}</button></div>
    <div class="chips"><button class="${todoProject === 'all' ? 'on' : ''}" onclick="todoProject='all';render()">${tr('All')} <span class="n">${open.filter(x => !hidden.has(x.projectId)).length}</span></button>
      ${shown.map(chip).join('')}
      ${hiddenOnes.length ? `<button onclick="todoShowHidden=!todoShowHidden;render()" title="${tr('Lists hidden from All')}">${icon(todoShowHidden ? 'eye' : 'eyeOff')}${tr('Hidden')} <span class="n">${hiddenOnes.length}</span></button>` : ''}
      ${todoShowHidden ? hiddenOnes.map(chip).join('') : ''}</div>
    ${projects.filter(p => todoProject !== 'all' || count(p.id)).map(p => {
      const mine = open.filter(x => x.projectId === p.id);
      const sections = L.sections.filter(s => s.projectId === p.id);
      const loose = mine.filter(x => !sections.some(s => s.id === x.sectionId));
      const isHidden = hidden.has(p.id);
      return `<div class="proj"><h3 ${drop(p.id, null)}>${esc(p.name)} <span class="n">${mine.length}</span>
          <button class="hide" title="${isHidden ? tr('Show this list in All again') : tr('Hide this list from All (still under Hidden)')}"
            onclick="todoHide(${esc(JSON.stringify(p.id))},${!isHidden})">${icon(isHidden ? 'eye' : 'eyeOff')}</button></h3>
        ${loose.length || !mine.length ? block(loose, { projectId: p.id, sectionId: null }) : ''}
        ${sections.map(s => { const inside = mine.filter(x => x.sectionId === s.id); return `<h4 ${drop(p.id, s.id)}>${esc(s.name)} <span class="n">${inside.length}</span></h4>${block(inside, { projectId: p.id, sectionId: s.id })}`; }).join('')}</div>`;
    }).join('') || `<div class="empty">${icon('todo')}${tr('Nothing to do.')}</div>`}
  </div>`;
  todoRedrawing = false;
  const again = $('todo-add');
  again.value = typed;
  if (focused) again.focus();
  const inlineAgain = $('todo-insert');
  if (inlineAgain) { inlineAgain.value = inlineTyped; inlineAgain.focus(); }
  const editAgain = $('todo-edit');
  if (editAgain && editTyped !== undefined) { editAgain.value = editTyped; if (editFocused) editAgain.focus(); } // redrawn under the typing
}

// Where a task can be added: index among the top-level tasks of a list (or section). Its input when open.
// An empty list shows it as a line to click.
function slot(place, index, visible) {
  const at = { ...place, index };
  if (JSON.stringify(at) === JSON.stringify(todoInsertAt))
    return `<div class="task inserting"><span class="check"></span><input id="todo-insert" class="inline" placeholder="${tr('Task name, Enter to add, Esc to cancel')}"
      onkeydown="if(event.key==='Enter')todoInsert();if(event.key==='Escape')closeInsert()" onblur="insertBlur()"></div>`;
  const i = todoSlots.push(at) - 1;
  return visible ? `<div class="addhere" onclick="openInsert(${i})">${icon('plus')}${tr('Add a task')}</div>`
    : `<div class="slot" title="${tr('Add a task here')}" onclick="openInsert(${i})"></div>`;
}

function row(x, depth) {
  const i = todoIndex.push(x) - 1;
  if (x.id === todoEditing) todoEditingAt = i;
  const meta = [dueLabel(x), x.recurring ? `<span title="${esc(tr('Repeats: {0}', x.dueText))}">${icon('repeat')}</span>` : '',
    x.description ? `<span title="${esc(x.description)}">${icon('note')}${esc(x.description.split('\n')[0])}</span>` : ''].filter(Boolean).join('');
  return `<div class="task ${todoPending.has(x.id) ? 'gone' : ''}" style="padding-left:${16 + depth * 26}px" data-i="${i}"
      ondragover="dragOver(event,${i})" ondragleave="this.classList.remove('drop-before','drop-after')" ondrop="dragDrop(event,${i})">
    <span class="grip" draggable="true" title="${tr('Drag to move')}" ondragstart="dragStart(event,${i})" ondragend="dragEnd()">${icon('grip')}</span>
    <button class="check p${x.priority}" title="${tr('Complete')}" onclick="todoComplete(${i})"></button>
    <div class="what">${todoEditing === x.id
      ? `<input id="todo-edit" class="inline" value="${esc(x.content)}" onkeydown="if(event.key==='Enter')commitEdit();if(event.key==='Escape')cancelEdit()" onblur="commitEdit()">`
      : `<div class="text" title="${tr('Click to edit')}" onmousedown="event.preventDefault();startEdit(${i})">${esc(x.content)}</div>`}${meta ? `<div class="tm">${meta}</div>` : ''}</div>
    <button class="pen" title="${state.todo.notes ? tr('Edit all: date, priority, list, notes') : tr('Edit all: date, priority, list')}" onclick="openTask(${i})">${icon('edit')}</button>
  </div>`;
}

// The text edited in place: Enter or clicking away saves, Esc cancels. The pen opens the drawer for the rest.
let todoEditing = null, todoEditingAt, todoRedrawing = false; // the task's id and its index in todoIndex

// On mousedown (its default prevented), so a click on another text while editing goes straight to it.
function startEdit(i) {
  commitEdit();
  todoEditing = todoIndex[i].id;
  todoEditingAt = i;
  todoKey = '';
  render();
  const input = $('todo-edit');
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

function cancelEdit() { closeEdit(todoIndex[todoEditingAt]?.content ?? ''); }

function commitEdit() {
  const input = $('todo-edit');
  if (!input || !todoEditing || todoRedrawing) return; // a redraw removing the input is not "clicking away"
  const x = state.todo.list.tasks.find(t => t.id === todoEditing), text = input.value.trim();
  if (x && text && text !== x.content) {
    todoLast = { kind: 'save' };
    send('todoSave', { id: x.id, content: text, description: x.description || '', due: x.dueText || '', priority: x.priority, projectId: x.projectId, sectionId: x.sectionId || '' });
    x.content = text; // shown at once; the reload brings what was saved
  }
  closeEdit(x?.content ?? text);
}

// Back to the text, in place: the rest of the page stays, so the click that ended the edit (check, pen, another task) still lands.
function closeEdit(text) {
  const input = $('todo-edit'), i = todoEditingAt;
  todoEditing = null;
  todoKey = '';
  if (input) input.outerHTML = `<div class="text" title="${tr('Click to edit')}" onmousedown="event.preventDefault();startEdit(${i})">${esc(text)}</div>`;
}

function openInsert(i) { todoInsertAt = todoSlots[i]; render(); }
function closeInsert() { if (todoInsertAt) { todoInsertAt = null; render(); } }

// Adds the typed task at the open slot; the input moves under it, for the next one.
function todoInsert() {
  const text = $('todo-insert').value.trim();
  if (!text) return closeInsert();
  const at = todoInsertAt;
  $('todo-insert').value = '';
  todoInsertAt = { ...at, index: at.index + 1 };
  todoLast = { kind: 'add' };
  toast(tr('Adding…'));
  send('todoInsert', { text, projectId: at.projectId, sectionId: at.sectionId || '', index: at.index });
  render();
}

// Drag and drop by the grip, among the tasks of the same list, section and parent (siblings); elsewhere nothing happens.
let dragged = null;
const siblingsOf = x => state.todo.list.tasks.filter(y => y.projectId === x.projectId && (y.sectionId || null) === (x.sectionId || null)
  && (y.parentId || null) === (x.parentId || null)).sort((a, b) => a.order - b.order);
const sameGroup = (a, b) => a.projectId === b.projectId && (a.sectionId || null) === (b.sectionId || null) && (a.parentId || null) === (b.parentId || null);

function dragStart(e, i) {
  dragged = todoIndex[i];
  const row = e.target.closest('.task');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragged.content);
  e.dataTransfer.setDragImage(row, 20, 16);
  setTimeout(() => { row.classList.add('dragging'); document.querySelector('.todo').classList.add('drag'); });
}

function dragEnd() {
  dragged = null;
  document.querySelectorAll('.dragging, .drop-before, .drop-after, .drop-on').forEach(r => r.classList.remove('dragging', 'drop-before', 'drop-after', 'drop-on'));
  document.querySelector('.todo')?.classList.remove('drag');
}

// Before or after the row under the mouse, by its half.
function dropSide(e) { const r = e.currentTarget.getBoundingClientRect(); return e.clientY < r.top + r.height / 2 ? 'before' : 'after'; }

// A task can land next to a task of its own group (keeping its parent), or next to a top-level task of another list
// or section (it becomes top-level there).
const canLand = x => dragged && x.id !== dragged.id && (sameGroup(x, dragged) || !x.parentId);

function dragOver(e, i) {
  if (!canLand(todoIndex[i])) return;
  e.preventDefault();
  const side = dropSide(e);
  e.currentTarget.classList.toggle('drop-before', side === 'before');
  e.currentTarget.classList.toggle('drop-after', side === 'after');
}

// Clicking away adds what was typed, as Enter does, and closes the input. Done in place, keeping the row's height,
// so the click that took the focus still lands; the next push redraws the list.
function insertBlur() {
  const input = $('todo-insert');
  if (!input || !todoInsertAt || todoRedrawing) return; // a redraw removing the input is not "clicking away"
  const text = input.value.trim(), at = todoInsertAt;
  todoInsertAt = null;
  todoKey = '';
  if (text) {
    todoLast = { kind: 'add' };
    toast(tr('Adding…'));
    send('todoInsert', { text, projectId: at.projectId, sectionId: at.sectionId || '', index: at.index });
  }
  input.closest('.task').outerHTML = `<div class="task gone" style="${text ? '' : 'visibility:hidden'}"><span class="check"></span>
    <div class="what"><div class="text">${esc(text || '-')}</div></div></div>`;
}

function dragDrop(e, i) {
  const x = todoIndex[i];
  if (!canLand(x)) return;
  e.preventDefault();
  const group = siblingsOf(sameGroup(x, dragged) ? dragged : x).filter(y => y.id !== dragged.id);
  place(x.projectId, x.sectionId || null, group.findIndex(y => y.id === x.id) + (dropSide(e) === 'after' ? 1 : 0));
}

// Headers (list, section) and the lists' chips take a task first in them.
function dropZone(e) {
  if (!dragged) return;
  e.preventDefault();
  e.currentTarget.classList.add('drop-on');
}

function dropFirst(e, projectId, sectionId) {
  e.currentTarget.classList.remove('drop-on');
  if (!dragged) return;
  e.preventDefault();
  place(projectId, sectionId, 0);
}

// Shown in its new place at once (moved and orders renumbered here), then saved; the reload brings the real order.
function place(projectId, sectionId, index) {
  const real = state.todo.list.tasks.find(y => y.id === dragged.id); // todoIndex can hold a copy
  const moving = real.projectId !== projectId || (real.sectionId || null) !== sectionId;
  if (moving) Object.assign(real, { projectId, sectionId, parentId: null });
  const order = siblingsOf(real).filter(y => y.id !== real.id);
  order.splice(index, 0, real);
  order.forEach((y, n) => y.order = n);
  dragEnd();
  todoKey = '';
  render();
  send('todoPlace', { id: real.id, projectId, sectionId: sectionId || '', index });
}

function todoHide(id, hide) {
  state.todo.hidden = hide ? [...state.todo.hidden, id] : state.todo.hidden.filter(h => h !== id); // until the settings are pushed back
  if (hide && todoProject === id) todoProject = 'all';
  todoKey = '';
  render();
  send('todoHide', { id, hide });
}

function dueLabel(x) {
  if (!x.due) return '';
  const d = x.due.slice(0, 10), time = x.due.length > 10 ? ' ' + x.due.slice(11, 16) : '';
  const date = new Date(d + 'T00:00');
  const text = d === day(0) ? tr('Today') : d === day(1) ? tr('Tomorrow') : d < day(0) || d > day(6)
    ? date.toLocaleDateString(LOCALE, { day: 'numeric', month: 'short', year: d.slice(0, 4) === day(0).slice(0, 4) ? undefined : 'numeric' })
    : date.toLocaleDateString(LOCALE, { weekday: 'long' });
  return `<span class="due ${d < day(0) ? 'over' : d === day(0) ? 'today' : ''}">${icon('calendar')}${esc(text + time)}</span>`;
}

function todoAdd() {
  const text = $('todo-add').value.trim();
  if (!text) return;
  todoLast = { kind: 'add' };
  $('todo-add').value = '';
  toast(tr('Adding…'));
  send('todoAdd', { text });
}

function todoComplete(i) {
  const x = todoIndex[i];
  todoPending.add(x.id);
  todoLast = { kind: 'complete', name: x.content };
  todoKey = '';
  render();
  send('todoComplete', { id: x.id });
}

// Called by C# after an edit: its error (null when done) and its result (for a completion: the id that reopens it).
function todoDone(error, result) {
  todoClearAfter = state.todo?.read ?? null;
  if (error) {
    todoPending.clear();
    todoKey = '';
    if (todoForm) $('k-error').innerHTML = `<div class="error-box">${esc(error)}</div>`;
    else toast(error, null, 'err');
    return;
  }
  if (todoForm) closeTask();
  if (todoLast?.kind === 'complete') toast(tr('Completed “{0}”', todoLast.name), result);
  else if (todoLast?.kind === 'add') toast(tr('Added'));
  else $('toast').innerHTML = '';
  todoLast = null;
}

function toast(text, undo, cls = '') {
  clearTimeout(toastTimer);
  $('toast').innerHTML = `<div class="toast ${cls}"><span>${esc(text)}</span>
    ${undo ? `<button onclick='todoLast=null;$("toast").innerHTML="";send("todoReopen",{id:${esc(JSON.stringify(undo))}})'>${tr('Undo')}</button>` : ''}</div>`;
  toastTimer = setTimeout(() => $('toast').innerHTML = '', cls === 'err' ? 10000 : 6000);
}

function openTask(i) {
  const x = todoIndex[i];
  todoForm = { task: x, content: x.content, description: x.description, due: x.dueText || '', priority: x.priority, projectId: x.projectId, sectionId: x.sectionId || '' };
  drawTask();
}

function closeTask() { todoForm = null; $('modal').innerHTML = ''; }

function drawTask() {
  const t = state.todo, L = t.list, f = todoForm;
  const sections = L.sections.filter(s => s.projectId === f.projectId);
  const prio = [[4, 'P1'], [3, 'P2'], [2, 'P3'], [1, 'P4']];
  $('modal').innerHTML = `<div class="overlay" onmousedown="if(event.target===this)closeTask()">
    <div class="drawer">
      <div class="dh"><span class="badge-kind" style="color:var(--accent)">${icon('todo')}</span><h3>${tr('Edit task')}</h3>
        <button class="icon" onclick="closeTask()" title="${tr('Close')}">${icon('close')}</button></div>
      <div class="db">
        <div class="field"><label for="k-content">${tr('Task')}</label>
          <input id="k-content" value="${esc(f.content)}" oninput="todoForm.content=this.value" onkeydown="if(event.key==='Enter')saveTask()"></div>
        ${t.notes ? `<div class="field"><label for="k-description">${tr('Notes')}</label>
          <textarea id="k-description" rows="4" oninput="todoForm.description=this.value">${esc(f.description)}</textarea></div>` : ''}
        <div class="field"><label for="k-due">${tr('Date')}</label>
          <div class="hint">${esc(t.dateHint)}</div>
          <div class="bar"><input id="k-due" value="${esc(f.due)}" oninput="todoForm.due=this.value"></div>
          <div class="datechips">${[['today', tr('Today')], ['tomorrow', tr('Tomorrow')], ['next week', tr('Next week')], ['', tr('No date')]].map(([v, l]) =>
            `<button onclick="todoForm.due='${v}';$('k-due').value='${v}'">${l}</button>`).join('')}</div></div>
        <div class="field"><label>${tr('Priority')}</label>
          <div class="prio">${prio.map(([v, l]) => `<button class="p${v} ${v === f.priority ? 'on' : ''}" onclick="todoForm.priority=${v};drawTask()">${icon('flag')}${l}</button>`).join('')}</div></div>
        <div class="field"><label for="k-project">${tr('Project')}</label>
          <div class="bar"><select id="k-project" onchange="todoForm.projectId=this.value;todoForm.sectionId='';drawTask()">${L.projects.map(p =>
            `<option value="${esc(p.id)}" ${p.id === f.projectId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
          ${t.sections && sections.length ? `<select id="k-section" onchange="todoForm.sectionId=this.value"><option value="">${tr('No section')}</option>${sections.map(s =>
            `<option value="${esc(s.id)}" ${s.id === f.sectionId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>` : ''}</div></div>
        <div id="k-error"></div>
      </div>
      <div class="df">
        <button class="danger" onclick="deleteTask()">${icon('trash')}${tr('Delete')}</button>
        <span class="grow"></span>
        <button onclick="closeTask()">${tr('Cancel')}</button>
        <button class="primary" onclick="saveTask()">${tr('Save')}</button>
      </div>
    </div></div>`;
}

function saveTask() {
  const f = todoForm;
  if (!f.content.trim()) { $('k-error').innerHTML = `<div class="error-box">${tr('The task is empty.')}</div>`; return; }
  todoLast = { kind: 'save' };
  send('todoSave', { id: f.task.id, content: f.content.trim(), description: f.description || '', due: f.due, priority: f.priority, projectId: f.projectId, sectionId: f.sectionId || '' });
}

function deleteTask() {
  if (!confirm(tr('Delete the task “{0}”? It cannot be undone.', todoForm.task.content))) return;
  todoLast = { kind: 'delete' };
  send('todoDelete', { id: todoForm.task.id });
}

// Trigger editor: a drawer over the page, outside #content, so the pushes every few seconds do not reset it.
let editing = null; // { original, name, on, prompt (or the command line), command, values: { field: text } }

function openEditor(name) {
  const t = name && state.triggers.find(x => x.name === name);
  editing = t ? { original: t.name, name: t.name, on: t.on, prompt: t.command || t.prompt, command: !!t.command, values: { ...t.values } }
           : { original: null, name: '', on: 'schedule', prompt: '', command: false, values: { schedule: 'daily 08:30' } };
  drawEditor();
}

function closeEditor() { editing = null; $('modal').innerHTML = ''; }

function drawEditor() {
  const kind = state.kinds.find(k => k.name === editing.on);
  const skill = (editing.prompt.match(/^\/([\w:-]+)/) || [])[1] || '';
  $('modal').innerHTML = `<div class="overlay" onmousedown="if(event.target===this)closeEditor()">
    <div class="drawer">
      <div class="dh">${kindBadge(editing.on)}<h3>${editing.original ? esc(tr('Edit {0}', editing.original)) : tr('New trigger')}</h3>
        <button class="icon" onclick="closeEditor()" title="${tr('Close')}">${icon('close')}</button></div>
      <div class="db">
        <div class="field"><label for="t-name">${tr('Name')}</label>
          <div class="hint">${tr('Letters, digits, - and _.')}</div>
          <input id="t-name" value="${esc(editing.name)}" oninput="editing.name=this.value" placeholder="morning-brief"></div>
        <div class="field"><label>${tr('Runs on')}</label>
          <div class="kinds">${state.kinds.map(k => `<button class="k-${k.name} ${k.name === editing.on ? 'on' : ''}" onclick="editing.on='${k.name}';drawEditor()">${icon(k.name)}${esc(k.label)}</button>`).join('')}</div></div>
        ${kind.form.map(fieldInput).join('')}
        <div class="field"><label for="t-prompt">${editing.command ? tr('Command') : tr('Prompt')}</label>
          <div class="bar"><select onchange="editing.command=this.value==='command';drawEditor()">
            <option value="prompt">${tr('The agent runs a prompt')}</option>
            <option value="command" ${editing.command ? 'selected' : ''}>${tr('The shell runs a command, no agent')}</option></select></div>
          ${editing.command ? `<div class="hint">${tr('Run by cmd on Windows, sh elsewhere, from your user folder. Exit code 0 is Done, the last output line is the summary.')}</div>
          <textarea id="t-prompt" class="mono" rows="3" oninput="editing.prompt=this.value">${esc(editing.prompt)}</textarea>
          ${kind.variables.length ? `<div class="hint">${tr('The event is in environment variables:')} ${kind.variables.map(v => `<span class="chip mono">BUTLER_${v.toUpperCase()}</span>`).join(' ')}<br>${tr('Write !BUTLER_X! with cmd (not %BUTLER_X%: a value with & would run a command), "$BUTLER_X" with sh.')}</div>` : ''}`
          : `<div class="hint">${tr('What the agent gets. Start with /skill to call one of your skills.')}</div>
          <div class="bar"><select onchange="setSkill(this.value)"><option value="">${tr('No skill')}</option>${state.skills.map(s =>
            `<option value="${esc(s.name)}" ${s.name === skill || s.folder === skill ? 'selected' : ''}>/${esc(s.name)}</option>`).join('')}</select></div>
          <textarea id="t-prompt" class="mono" rows="7" oninput="editing.prompt=this.value">${esc(editing.prompt)}</textarea>
          ${kind.variables.length ? `<div class="vars"><span class="muted">${tr('Insert:')}</span>${kind.variables.map(v => `<span class="chip" onclick="insertVar('${v}')">\${${v}}</span>`).join('')}</div>
            <div class="hint">${tr('Filled from the event. Without any, the event is appended.')}</div>` : ''}`}
        </div>
        <div id="t-error"></div>
      </div>
      <div class="df">
        ${editing.original ? `<button class="danger" onclick="deleteTrigger()">${icon('trash')}${tr('Delete')}</button>` : ''}
        <span class="grow"></span>
        <button onclick="closeEditor()">${tr('Cancel')}</button>
        <button class="primary" onclick="saveTrigger()">${tr('Save')}</button>
      </div>
    </div></div>`;
}

const days = [['mon', tr('Monday')], ['tue', tr('Tuesday')], ['wed', tr('Wednesday')], ['thu', tr('Thursday')], ['fri', tr('Friday')], ['sat', tr('Saturday')], ['sun', tr('Sunday')]];

function fieldInput(f) {
  const v = editing.values[f.name] || '';
  const head = `<label for="f-${f.name}">${esc(f.label)}${f.optional ? ` <span class="muted">${tr('(optional)')}</span>` : ''}</label>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}`;
  const set = `oninput="editing.values['${f.name}']=this.value"`;
  if (f.type === 'schedule') {
    const m = v.match(/^(daily|monthly:(\d+)|([a-z,-]+)) (\d{1,2}:\d{2})$/i) || [, 'daily', , , '08:30'];
    const on = m[3] ? expandDays(m[3]) : [];
    const freq = editing.freq || (m[2] ? 'monthly' : !m[3] ? 'daily' : on.join() === 'mon,tue,wed,thu,fri' ? 'weekdays' : 'days');
    return `<div class="field">${head}<div class="bar">
      <select id="s-freq" onchange="scheduleChanged()">${[['daily', tr('Every day')], ['weekdays', tr('Weekdays (Mon–Fri)')], ['days', tr('Days of the week')], ['monthly', tr('Every month')]].map(([k, l]) => `<option value="${k}" ${k === freq ? 'selected' : ''}>${l}</option>`).join('')}</select>
      ${freq === 'monthly' ? `<select id="s-day" onchange="scheduleChanged()">${Array.from({ length: 31 }, (_, i) => i + 1).map(d => `<option value="${d}" ${String(d) === m[2] ? 'selected' : ''}>${tr('on day {0}', d)}</option>`).join('')}</select>` : ''}
      <input id="s-time" type="time" value="${m[4].padStart(5, '0')}" onchange="scheduleChanged()" style="flex:0 0 120px"></div>
      ${freq === 'days' ? `<div class="days" id="s-days">${days.map(([k, l]) => `<label><input type="checkbox" value="${k}" ${on.includes(k) ? 'checked' : ''} onchange="scheduleChanged()">${l.slice(0, 3)}</label>`).join('')}</div>` : ''}</div>`;
  }
  if (f.type === 'list') return `<div class="field">${head}<textarea id="f-${f.name}" class="mono" rows="3" ${set}>${esc(v)}</textarea></div>`;
  const browse = f.type === 'folder' ? `<button onclick="send('browse',{pick:'folder',title:${js(f.label)},target:'f-${f.name}',value:$('f-${f.name}').value})">${icon('folder')}${tr('Browse…')}</button>` : '';
  return `<div class="field">${head}<div class="bar"><input id="f-${f.name}" class="mono" value="${esc(v)}" ${set}>${browse}</div></div>`;
}

// "mon-fri" / "fri-mon" / "mon,wed" as day keys in the order of `days` (as the scheduler reads them).
function expandDays(text) {
  const week = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'], set = new Set();
  for (const part of text.toLowerCase().split(',')) {
    const [a, b = a] = part.split('-').map(n => week.indexOf(n));
    if (a < 0 || b < 0) continue;
    for (let d = a; ; d = (d + 1) % 7) { set.add(week[d]); if (d === b) break; }
  }
  return days.map(d => d[0]).filter(k => set.has(k));
}

function scheduleChanged() {
  const freq = $('s-freq').value, day = $('s-day')?.value, time = $('s-time').value || '08:30';
  // Days of the week: the boxes ticked, or (just switched to it) the days of the current schedule.
  const ticked = $('s-days') ? [...document.querySelectorAll('#s-days input:checked')].map(i => i.value)
    : expandDays(editing.values.schedule?.split(' ')[0] || '');
  editing.freq = freq; // "Days of the week" with mon..fri ticked stays that, not "Weekdays"
  editing.values.schedule = freq === 'daily' ? `daily ${time}` : freq === 'weekdays' ? `mon-fri ${time}`
    : freq === 'monthly' ? `monthly:${/^\d+$/.test(day || '') ? day : 1} ${time}` : `${(ticked.length ? ticked : ['mon']).join(',')} ${time}`;
  drawEditor();
}

function setSkill(name) {
  const rest = editing.prompt.replace(/^\/[\w:-]+\s*/, '');
  editing.prompt = name ? `/${name}${rest ? ' ' + rest : ''}` : rest;
  $('t-prompt').value = editing.prompt;
}

function insertVar(v) {
  const ta = $('t-prompt'), at = ta.selectionStart ?? ta.value.length, text = '${' + v + '}';
  ta.value = ta.value.slice(0, at) + text + ta.value.slice(ta.selectionEnd ?? at);
  editing.prompt = ta.value;
  ta.focus();
  ta.selectionStart = ta.selectionEnd = at + text.length;
}

function saveTrigger() {
  const kind = state.kinds.find(k => k.name === editing.on);
  const values = Object.fromEntries(kind.form.map(f => [f.name, editing.values[f.name] || '']));
  send('saveTrigger', { original: editing.original || '', name: editing.name, on: editing.on, prompt: editing.prompt, command: editing.command, values });
}

function deleteTrigger() {
  if (confirm(tr('Delete the trigger “{0}”?', editing.original))) send('deleteTrigger', { name: editing.original });
}

// Called by C# after a save or a delete: the error, or null when the triggers file was written.
function triggerSaved(error) {
  if (!editing) return;
  if (error) $('t-error').innerHTML = `<div class="error-box">${esc(error)}</div>`;
  else closeEditor();
}

addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (editing) closeEditor(); if (todoForm) closeTask(); }
  if (e.key === 'F5' && view === 'todo' && state.todo) { e.preventDefault(); send('todoRefresh'); } // as the Refresh button, not a page reload
});

// Drawn once per visit: the state is pushed every few seconds while a run is live, and must not reset what is being typed.
function renderSettings() {
  if ($('s-cli')) return checkSettings();
  const s = state.settings;
  $('content').innerHTML = `<div class="settings">
    <div class="card">
      <h3>${tr('Agent')}</h3>
      <div class="field">
        <label for="s-cli">${tr('CLI that runs the triggers')}</label>
        <div class="hint">${tr('Applies to the next run. A waiting run is answered with the CLI that started it.')}</div>
        <div class="bar"><select id="s-cli" onchange="checkSettings()">${Object.keys(s.installed).map(n =>
          `<option value="${n}" ${n === s.cli ? 'selected' : ''}>${esc(cliNames[n] || n)}</option>`).join('')}</select></div>
        <div id="s-cli-status"></div>
        <div class="err" id="e-cli"></div>
      </div>
    </div>
    <div class="card">
      <h3>${tr('Triggers and skills')}</h3>
      ${pathField('triggersFile', tr('Triggers file'), tr('The list of triggers (JSON). Keep it next to the skills it calls, in their git repo.'), s.triggersFile)}
      ${pathField('skillsFolder', tr('Skills folder'), tr('Listed on the Skills page; “Ask AI” opens there.'), s.skillsFolder)}
    </div>
    <div class="card">
      <h3>Azure DevOps</h3>
      <div class="field">
        <label for="s-adoOrganization">${tr('Organization')}</label>
        <div class="hint">${tr('For “Azure DevOps” triggers, read with the az CLI (logged in, azure-devops extension). Empty: no such trigger can run.')}</div>
        <div class="bar"><input id="s-adoOrganization" class="mono" value="${esc(s.adoOrganization)}" placeholder="https://dev.azure.com/your-org" oninput="checkSettings()"></div>
        <div class="err" id="e-adoOrganization"></div>
      </div>
    </div>
    <div class="card">
      <h3>${tr('To do')}</h3>
      <div class="field">
        <label for="s-todo">${tr('List shown on the To do page')}</label>
        <div class="hint">${tr('Butler shows it and lets you edit it by hand. Agents reach the same list with their own tools (the Todoist connector, or the file).')}</div>
        <div class="bar"><select id="s-todo" onchange="checkSettings()">${s.todos.map(b =>
          `<option value="${b.name}" ${b.name === s.todo ? 'selected' : ''}>${esc(b.label)}</option>`).join('')}</select></div>
        <div class="err" id="e-todo"></div>
      </div>
      <div id="s-todo-txt">${pathField('todoFile', tr('todo.txt file'), tr('One task per line, in the todo.txt format (todotxt.org): (A) Call Lena +Work due:2026-11-03. Created with the first task.'), s.todoFile, 'file', `${tr('Text')} (*.txt)|*.txt|${tr('All files')}|*.*`)}</div>
      <div class="field" id="s-todo-todoist">
        <label for="s-todoistToken">${tr('Todoist API token')}</label>
        <div class="hint">${tr('In Todoist: Settings → Integrations → Developer. Kept in {0}, not in the settings file.', esc(s.secretStore))}</div>
        <div class="bar"><input id="s-todoistToken" type="password" class="mono" autocomplete="off" oninput="checkSettings()"
            placeholder="${s.todoist ? tr('Saved. Paste a new one to replace it') : tr('Paste your token')}">
          ${s.todoist ? `<button id="s-forget" onclick="forgetTodoist()">${tr('Forget')}</button>` : ''}</div>
        <div class="err" id="e-todoistToken"></div>
      </div>
    </div>
    <div class="card">
      <h3>${tr('Display')}</h3>
      <div class="field">
        <label for="s-language">${tr('Language')}</label>
        <div class="hint">${tr('Of the dashboard, the tray menu and the notifications. Automatic: the system’s language.')}</div>
        <div class="bar"><select id="s-language" onchange="checkSettings()">${[['auto', tr('Automatic')], ['en', 'English'], ['fr', 'Français']].map(([v, l]) =>
          `<option value="${v}" ${v === s.language ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="err" id="e-language"></div>
      </div>
    </div>
    <div class="card">
      <h3>${tr('Startup')}</h3>
      <div class="field">
        <label for="s-startPage">${tr('Start page')}</label>
        <div class="hint">${tr('The page shown when the dashboard opens.')}</div>
        <div class="bar"><select id="s-startPage" onchange="checkSettings()">${[...document.querySelectorAll('nav a[data-view]')].map(a =>
          `<option value="${a.dataset.view}" ${a.dataset.view === s.startPage ? 'selected' : ''}>${esc(a.querySelector('.label').textContent)}</option>`).join('')}</select></div>
        <div class="err" id="e-startPage"></div>
      </div>
      <div class="field">
        <label><input id="s-startup" type="checkbox" ${s.startup ? 'checked' : ''} onchange="checkSettings()"> ${esc(s.startupLabel)}</label>
        <div class="hint">${tr('When you sign in, in the tray. Without it, triggers wait until Butler is started (a missed schedule then runs once).')}</div>
        <div class="err" id="e-startup"></div>
      </div>
    </div>
    <div class="card">
      <h3>${tr('Updates')}</h3>
      <div class="field">
        <div class="hint">${esc(tr('Installed: {0}. Butler also looks for a new version on GitHub once a day.', state.version))}</div>
        <div class="bar"><button id="u-check" onclick="checkUpdate()">${tr('Check for updates')}</button></div>
        <div id="u-result"></div>
      </div>
    </div>
    <div class="savebar">
      <button class="primary" id="s-save" onclick="saveSettings()">${tr('Save')}</button>
      <button id="s-revert" onclick="$('content').innerHTML='';renderSettings()">${tr('Revert')}</button>
      <span class="muted" id="s-msg"></span>
      <span class="muted mono file" title="${tr("Butler's settings, local to this PC")}">${esc(s.file)}</span>
    </div>
  </div>`;
  checkSettings();
  if (state.newVersion) updateChecked(state.newVersion, null);
}

function checkUpdate() {
  $('u-check').disabled = true;
  $('u-result').innerHTML = `<span class="muted">${tr('Checking…')}</span>`;
  send('checkUpdate');
}

// Called by C# with the newer release (or null) and the error.
function updateChecked(release, error) {
  if (!$('u-result')) return;
  $('u-check').disabled = false;
  $('u-result').innerHTML = error ? `<div class="err">${esc(error)}</div>`
    : !release ? `<span class="ok">${tr('Butler is up to date.')}</span>`
    : `<div class="bar"><span>${esc(tr('Version {0} is available', release.version))} · <a href="${esc(release.url)}">${tr('What’s new')}</a></span>
      ${release.download ? `<button class="primary" id="u-install" onclick="installUpdate()">${tr('Install and restart')}</button>` : ''}</div>`;
}

function installUpdate() {
  $('u-install').disabled = $('u-check').disabled = true;
  $('u-result').insertAdjacentHTML('beforeend', `<span class="muted">${tr('Downloading…')}</span>`);
  send('update');
}

const cliNames = { claude: 'Claude Code', copilot: 'GitHub Copilot CLI' };
const pathField = (id, label, hint, value, pick = 'file', filter = `JSON (*.json)|*.json|${tr('All files')}|*.*`) => `<div class="field">
  <label for="s-${id}">${label}</label>
  <div class="hint">${hint}</div>
  <div class="bar"><input id="s-${id}" class="mono" value="${esc(value)}" oninput="checkSettings()">
    <button onclick="send('browse',{pick:'${pick}',filter:${js(filter)},title:${js(label)},target:'s-${id}',value:$('s-${id}').value})">${icon('folder')}${tr('Browse…')}</button></div>
  <div class="err" id="e-${id}"></div></div>`;
const settingsDraft = () => ({ cli: $('s-cli').value, triggersFile: $('s-triggersFile').value.trim(), skillsFolder: $('s-skillsFolder').value.trim(),
  adoOrganization: $('s-adoOrganization').value.trim(), todo: $('s-todo').value, todoFile: $('s-todoFile').value.trim(), todoistToken: $('s-todoistToken').value.trim(),
  startPage: $('s-startPage').value, language: $('s-language').value, startup: $('s-startup').checked });

function forgetTodoist() {
  if (!confirm(tr('Forget the Todoist token? The To do page cannot read Todoist until a new one is saved.'))) return;
  send('forgetTodoist');
  $('s-forget').remove();
  $('s-todoistToken').placeholder = tr('Paste your token');
}

// Whether the chosen CLI is installed; Save only when something changed.
function checkSettings() {
  const s = state.settings, d = settingsDraft(), path = s.installed[d.cli];
  $('s-cli-status').innerHTML = (path ? `<span class="ok">✓ ${tr('Installed:')} <span class="mono">${esc(path)}</span></span>` : `<span class="err">✗ ${tr('Not installed: not found on the PATH')}</span>`)
    + (d.cli === 'copilot' ? `<div class="note" style="margin-top:6px">${tr('Copilot runs with --allow-all-tools: nothing reviews what it does, even when a mail is in the prompt. No Chrome, no cost per run.')}</div>` : '');
  $('s-todo-txt').hidden = d.todo !== 'txt';
  $('s-todo-todoist').hidden = d.todo !== 'todoist';
  const dirty = d.todoistToken !== '' || Object.keys(d).some(k => k !== 'todoistToken' && d[k] !== s[k]);
  $('s-save').disabled = !dirty;
  $('s-revert').hidden = !dirty;
}

function saveSettings() {
  $('s-msg').textContent = tr('Saving…');
  send('saveSettings', settingsDraft());
}

// Called by C# after a save: the problems by field, none when saved.
function settingsSaved(problems) {
  if (!$('s-cli')) return;
  for (const k of Object.keys(settingsDraft())) $('e-' + k).textContent = problems[k] || '';
  $('s-msg').textContent = Object.keys(problems).length ? tr('Not saved.') : tr('Saved.');
  if (!Object.keys(problems).length && $('s-todoistToken').value) {
    $('s-todoistToken').value = '';
    $('s-todoistToken').placeholder = tr('Saved. Paste a new one to replace it');
  }
}

// Called by C# with the file or folder chosen in a Browse dialog, for the input with that id.
function picked(target, path) {
  const el = $(target);
  if (!el) return;
  el.value = path;
  el.dispatchEvent(new Event('input'));
}

document.querySelectorAll('nav a').forEach(a => a.onclick = () => { view = a.dataset.view; draw(); $('content').scrollTop = 0; });
let last = '';
// Called by C# with the whole state.
function receive(data) {
  const json = JSON.stringify(data);
  if (json === last) return; // pushed every few seconds; only redraw on change
  const first = OPEN || data.settings.startPage; // OPEN: the page shown before a change of language reloaded this one
  if (!last && document.querySelector(`nav a[data-view="${first}"]`)) view = first; // the first push
  last = json;
  state = data;
  $('new-version').innerHTML = data.newVersion ? `<a href="${esc(data.newVersion.url)}">${esc(tr('Version {0} is available', data.newVersion.version))}</a>` : '';
  render();
}
</script>
</body>
</html>
